<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sepidehsadat Hosseini</title>
  <meta name="description" content="Sepidehsadat Hosseini" />
  <link rel="shortcut icon" href="favicon.ico" />

  <!-- Google Font: Roboto -->
  <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700,900&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root{
      /* Base tokens */
      --radius-2:12px;
      --radius-3:18px;
      --shadow:0 10px 26px rgba(0,0,0,.15);

      /* Accent (kept for potential FAB) */
      --sky:#4F46E5;
      --tangerine:#F59E0B;

      /* Defaults (overridden by themes) */
      --bg:#f6f7f8;
      --panel:#ffffff;
      --back:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --link:#2563eb;
      --border:#e5e7eb;
      --gold:#f59e0b;
      --chip-text:#0f172a;
      --dot-from:#93c5fd;
      --dot-to:#2563eb;
    }

    /* ========================= THEMES ========================= */

    /* Light */
    html[data-theme="light"]{
      color-scheme: light;
      --bg:#f6f7f8;
      --panel:#ffffff;
      --back:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --link:#2563eb;
      --border:#e5e7eb;
      --gold:#f59e0b;
      --chip-text:#0f172a;
      --dot-from:#93c5fd;
      --dot-to:#2563eb;
    }

    /* Dark */
    html[data-theme="dark"]{
      color-scheme: dark;
      --bg:#0b1220;
      --panel:#0f172a;
      --back:#111827;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --link:#93c5fd;
      --border:#1f2937;
      --gold:#f59e0b;
      --chip-text:#e5e7eb;
      --dot-from:#fde68a;
      --dot-to:#f59e0b;
      --shadow:0 12px 28px rgba(0,0,0,.45);
    }

    /* Improved BLUE theme */
    html[data-theme="blue"]{
      --bg:#F3F6FF;
      --panel:#FFFFFF;
      --back:#FFFFFF;
      --text:#0B1220;
      --muted:#475569;
      --link:#1E40AF;
      --border:#D6E3FF;
      --gold:#2563EB;
      --chip-text:#0B1220;
      --dot-from:#93C5FD;
      --dot-to:#1E3A8A;
      --shadow:0 12px 28px rgba(20, 32, 85, .12);
    }

    /* Green (jungle vibe) */
    html[data-theme="green"]{
      --bg:#E9F4EC;
      --panel:#F6F5F0;
      --back:#ffffff;
      --text:#12281C;
      --muted:#2E8B57;
      --link:#E5A23D;
      --border:#cfe5d6;
      --gold:#E5A23D;
      --chip-text:#0b3a2b;
      --dot-from:#E5A23D;
      --dot-to:#b7791f;
    }

    /* Orange */
    html[data-theme="orange"]{
      --bg:#FFF7ED;
      --panel:#ffffff;
      --back:#ffffff;
      --text:#1f2937;
      --muted:#b45309;
      --link:#ea580c;
      --border:#fed7aa;
      --gold:#f97316;
      --chip-text:#7c2d12;
      --dot-from:#fbbf24;
      --dot-to:#f97316;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    html{scroll-behavior:smooth}
    body{margin:0; font-family: Roboto, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; color:var(--text); background:var(--bg); line-height:1.65}
    a{color:var(--link); text-decoration:none}
    a:hover{text-decoration:underline}

    /* Top nav */
    .topnav{position:sticky; top:0; z-index:100; background:rgba(255,255,255,.92); backdrop-filter:saturate(120%) blur(8px); border-bottom:1px solid var(--border)}
    html[data-theme="dark"] .topnav{background:rgba(15,23,42,.7)}
    .topnav-inner{max-width:1200px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px; justify-content:space-between}
    .tabs{display:flex; gap:8px; overflow:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    .tabs a{white-space:nowrap; padding:8px 14px; border:1px solid var(--border); border-radius:10px; background:var(--back); font-size:14px; color:var(--text); transition:all .18s ease}

    /* Cute dots control */
    .theme-dots{display:flex; align-items:center; gap:10px}
    .theme-dot{width:14px; height:14px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,.9); box-shadow:0 2px 6px rgba(0,0,0,.15); transition:transform .15s ease, box-shadow .2s ease}
    .theme-dot:hover{transform:scale(1.15)}
    .theme-dot:focus-visible{outline:2px solid var(--link); outline-offset:2px}
    .theme-dot.active{box-shadow:0 0 0 3px color-mix(in srgb, var(--link) 50%, transparent)}

    /* Layout */
    .wrapper{display:grid; grid-template-columns:320px 1fr; gap:28px; max-width:1200px; margin:28px auto 64px; padding:0 16px}
    .sidebar{position:sticky; top:76px; height:fit-content; background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-3); box-shadow:var(--shadow); padding:22px}
    .profile{display:flex; align-items:center; gap:14px}
    .avatar{border-radius:50%; width:92px; height:92px; object-fit:cover; border:2px solid var(--border)}
    h1{font-size:24px; margin:0}
    .role{margin-top:6px; color:var(--muted)}
    .chips{margin-top:14px; display:flex; flex-wrap:wrap; gap:8px}
    .chip{background:color-mix(in srgb, var(--gold) 18%, var(--back) 82%); color:var(--chip-text); border:1px solid var(--border); padding:6px 10px; font-size:12px; border-radius:999px}
    .links{margin-top:16px; display:flex; gap:12px; font-size:22px; flex-wrap:wrap}
    .links a{display:inline-flex; width:36px; height:36px; align-items:center; justify-content:center; border-radius:8px; background:var(--back); border:1px solid var(--border); color:var(--text)}
    .contact{margin-top:16px; font-size:14px; color:var(--muted)}

    .main{display:flex; flex-direction:column; gap:22px}
    .card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius-3); box-shadow:var(--shadow); padding:22px; scroll-margin-top:84px}
    .section-title{display:flex; align-items:center; gap:10px; font-size:18px; margin:0 0 10px}
    .section-title .dot{width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 35%, var(--dot-from), var(--dot-to));}
    p{margin:10px 0}

    /* Publications */
    .pub{padding:16px; border:1px solid var(--border); border-radius:var(--radius-2); background:var(--back)}
    .pub + .pub{margin-top:12px}
    .pub-title{font-weight:600; font-size:16px}
    .venue{margin:6px 0 4px; font-size:13px; color:var(--muted)}
    .authors{font-size:14px; color:var(--text)}
    .me{color:inherit; text-decoration:underline; text-decoration-thickness:2px; text-underline-offset:3px}
    .links-row{margin-top:6px; font-size:14px}

    /* Experience/Teaching grid */
    .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
    .exp-item{padding:12px 14px; border-radius:var(--radius-2); border:1px solid var(--border); background:var(--back)}
    .exp-top{display:flex; justify-content:space-between; align-items:center; gap:8px}
    .exp-title{font-weight:600}
    .time{font-size:12px; color:var(--muted)}
    .company{font-size:14px; color:var(--text); margin-top:4px}

    footer{max-width:1200px; margin:24px auto 36px; padding:0 16px; color:var(--muted); font-size:12px; text-align:center}

    /* Responsive */
    @media (max-width: 900px){ .wrapper{grid-template-columns:1fr; gap:18px} .sidebar{position:static} }
